<!DOCTYPE html>
<html>

<head>
    <title>LMS</title>
    <style>
        body {
            font-family: Arial;
            max-width: 800px;
            margin: 20px auto;
            padding: 0 20px;
        }

        .section {
            border: 1px solid #ccc;
            padding: 15px;
            margin: 10px 0;
        }

        input,
        select,
        button {
            padding: 8px;
            margin: 5px;
        }

        button {
            cursor: pointer;
            background: #007bff;
            color: white;
            border: none;
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .hidden {
            display: none;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th,
        td {
            border: 1px solid #ccc;
            padding: 8px;
            text-align: left;
        }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #fff;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <h1>Learning Management System</h1>

    <!-- Login -->
    <div id="loginDiv" class="section">
        <h2>Login</h2>
        <input type="number" id="userId" placeholder="User ID">
        <input type="text" id="userName" placeholder="Your Name">
        <select id="userRole">
            <option value="student">Student</option>
            <option value="teacher">Teacher</option>
        </select>
        <button onclick="login()">Login</button>
    </div>

    <!-- Teacher Panel -->
    <div id="teacherPanel" class="hidden">
        <h2>Teacher Panel - <span id="teacherName"></span></h2>

        <div class="section">
            <h3>Create Course</h3>
            <input type="text" id="courseName" placeholder="Course Name">
            <button onclick="createCourse()">Create</button>
        </div>

        <div class="section">
            <h3>Add Assignment</h3>
            <select id="courseSelect"></select>
            <input type="text" id="assignmentTitle" placeholder="Assignment Title">
            <input type="text" id="assignmentTask" placeholder="Task instructions for student">
            <input type="date" id="dueDate">
            <button onclick="createAssignment()">Add Assignment</button>
        </div>

        <div class="section">
            <h3>My Courses</h3>
            <div id="teacherCourses"></div>
        </div>

        <button onclick="logout()">Logout</button>
    </div>

    <!-- Student Panel -->
    <div id="studentPanel" class="hidden">
        <h2>Student Panel - <span id="studentName"></span></h2>

        <div class="section">
            <h3>Join Course</h3>
            <input type="number" id="joinCourseId" placeholder="Course ID">
            <input type="text" id="joinCourseName" placeholder="Course Name">
            <button onclick="joinCourse()">Join</button>
        </div>

        <div class="section">
            <h3>My Assignments <button onclick="loadStudentData()">Refresh</button></h3>
            <div id="studentAssignments"></div>
        </div>

        <div class="section">
            <h3>Submit Assignment</h3>
            <select id="assignmentSelect"></select>
            <textarea id="submissionContent" placeholder="Your answer" rows="4" cols="50"></textarea><br>
            <button id="submitBtn" onclick="submitAssignment()">Submit</button>
        </div>

        <div class="section">
            <h3>My Submissions</h3>
            <div id="studentSubmissions"></div>
        </div>

        <button onclick="logout()">Logout</button>
    </div>

    <script>
        const API = 'http://localhost:8000';
        let user = null;

        async function login() {
            const id = document.getElementById('userId').value;
            const name = document.getElementById('userName').value;
            const role = document.getElementById('userRole').value;

            if (!id || !name) { alert('Enter ID and Name'); return; }

            const res = await fetch(`${API}/login?user_id=${id}&name=${encodeURIComponent(name)}&role=${role}`, { method: 'POST' });
            if (!res.ok) {
                const err = await res.json();
                alert('Error: ' + err.detail);
                return;
            }
            user = await res.json();

            document.getElementById('loginDiv').classList.add('hidden');

            if (role === 'teacher') {
                document.getElementById('teacherName').textContent = user.name;
                document.getElementById('teacherPanel').classList.remove('hidden');
                loadTeacherCourses();
            } else {
                document.getElementById('studentName').textContent = user.name;
                document.getElementById('studentPanel').classList.remove('hidden');
                loadStudentData();
            }
        }

        function logout() {
            user = null;
            document.getElementById('teacherPanel').classList.add('hidden');
            document.getElementById('studentPanel').classList.add('hidden');
            document.getElementById('loginDiv').classList.remove('hidden');
        }

        // Teacher functions
        async function createCourse() {
            const name = document.getElementById('courseName').value;
            if (!name) { alert('Enter course name'); return; }

            const res = await fetch(`${API}/courses/`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name: name, teacher_id: user.id })
            });
            if (res.ok) {
                document.getElementById('courseName').value = '';
                alert('Course created!');
                loadTeacherCourses();
            } else {
                const err = await res.json();
                alert('Error: ' + err.detail);
            }
        }

        async function loadTeacherCourses() {
            const res = await fetch(`${API}/courses/teacher/${user.id}`);
            const courses = await res.json();

            // Update courses list
            let html = '<table><tr><th>ID</th><th>Name</th></tr>';
            courses.forEach(c => { html += `<tr><td>${c.id}</td><td>${c.name}</td></tr>`; });
            html += '</table>';
            document.getElementById('teacherCourses').innerHTML = html;

            // Update dropdown
            let options = '';
            courses.forEach(c => { options += `<option value="${c.id}">${c.name}</option>`; });
            document.getElementById('courseSelect').innerHTML = options;
        }

        async function createAssignment() {
            const courseId = document.getElementById('courseSelect').value;
            const title = document.getElementById('assignmentTitle').value;
            const task = document.getElementById('assignmentTask').value;
            const dueDate = document.getElementById('dueDate').value;

            if (!courseId) { alert('Create a course first'); return; }
            if (!title || !task || !dueDate) { alert('Fill all fields'); return; }

            const res = await fetch(`${API}/courses/${courseId}/assignments`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title: title, task: task, due_date: dueDate, course_id: parseInt(courseId) })
            });
            if (res.ok) {
                document.getElementById('assignmentTitle').value = '';
                document.getElementById('assignmentTask').value = '';
                alert('Assignment created!');
            } else {
                const err = await res.json();
                alert('Error: ' + err.detail);
            }
        }

        // Student functions
        async function joinCourse() {
            const courseId = document.getElementById('joinCourseId').value;
            const name = document.getElementById('joinCourseName').value;
            if (!courseId || !name) { alert('Enter both Course ID and Name'); return; }

            const res = await fetch(`${API}/courses/enroll/${user.id}?course_name=${encodeURIComponent(name)}&course_id=${courseId}`, { method: 'POST' });
            if (res.ok) {
                document.getElementById('joinCourseId').value = '';
                document.getElementById('joinCourseName').value = '';
                alert('Joined course!');
                loadStudentData();
            } else {
                const err = await res.json();
                alert('Error: ' + err.detail);
            }
        }

        async function loadStudentData() {
            // Load assignments
            const res = await fetch(`${API}/courses/students/${user.id}/assignments`);
            const assignments = await res.json();

            let html = '<table><tr><th>ID</th><th>Title</th><th>Task</th><th>Due Date</th></tr>';
            let options = '';
            assignments.forEach(a => {
                html += `<tr><td>${a.id}</td><td>${a.title}</td><td>${a.task}</td><td>${a.due_date}</td></tr>`;
                options += `<option value="${a.id}">${a.title}</option>`;
            });
            html += '</table>';
            document.getElementById('studentAssignments').innerHTML = html;
            document.getElementById('assignmentSelect').innerHTML = options;

            // Load submissions
            const res2 = await fetch(`${API}/assignments/user/${user.id}/submissions`);
            const submissions = await res2.json();

            let html2 = '<table><tr><th>Assignment ID</th><th>Content</th><th>Score</th><th>Feedback</th></tr>';
            submissions.forEach(s => {
                html2 += `<tr><td>${s.assignment_id}</td><td>${s.content}</td><td>${s.score || '-'}</td><td>${s.ai_feedback || '-'}</td></tr>`;
            });
            html2 += '</table>';
            document.getElementById('studentSubmissions').innerHTML = html2;
        }

        async function submitAssignment() {
            const assignmentId = document.getElementById('assignmentSelect').value;
            const content = document.getElementById('submissionContent').value;
            const btn = document.getElementById('submitBtn');

            if (!assignmentId) { alert('No assignment selected'); return; }
            if (!content) { alert('Enter your answer'); return; }

            // Show loading state
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span>Grading...';

            try {
                const res = await fetch(`${API}/assignments/${assignmentId}/submissions`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ content: content, assignment_id: parseInt(assignmentId), student_id: user.id })
                });
                if (res.ok) {
                    document.getElementById('submissionContent').value = '';
                    alert('Submitted and graded!');
                    loadStudentData();
                } else {
                    const err = await res.json();
                    alert('Error: ' + err.detail);
                }
            } finally {
                // Reset button
                btn.disabled = false;
                btn.innerHTML = 'Submit';
            }
        }
    </script>
</body>

</html>
