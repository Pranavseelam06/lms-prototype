name: Keep Render Awake
on:
  schedule:
    - cron: "*/14 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render FastAPI
        run: |
          echo "Pinging server..."
          curl -fsS --retry 3 --retry-delay 10 https://lms-prototype-1.onrender.com/health || echo "Server may be waking up"